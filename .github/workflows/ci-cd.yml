name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - preprod
  pull_request:
    branches:
      - main
      - preprod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Build web
        run: flutter build web --release