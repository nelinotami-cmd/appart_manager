name: appartements_erp
description: ERP SaaS - Gestion d'appartements meubles (Cameroun)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  hydrated_bloc: ^9.1.5
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.7.0
  appwrite: ^13.0.0
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.preprod
    - .env.prod
